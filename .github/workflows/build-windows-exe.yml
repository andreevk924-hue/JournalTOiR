name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m compileall -q .
          python -c "import main; print('Main import OK')"

      - name: Build portable one-file EXE
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Journal_TOiR --icon resources/app_icon.ico --add-data "resources;resources" --hidden-import PySide6.QtPrintSupport --hidden-import PySide6.QtSvg main.py

      - name: Show build result
        shell: pwsh
        run: Get-Item dist\\Journal_TOiR.exe | Format-List Name,Length,LastWriteTime

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Journal_TOiR_Windows
          path: dist/Journal_TOiR.exe
          if-no-files-found: error
          retention-days: 30
