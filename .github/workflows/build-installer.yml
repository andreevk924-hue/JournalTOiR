name: Build JournalTOiR Windows Installer

on:
  push:
    branches:
      - chatgpt-build-sync-fix
    paths:
      - "installer/**"
      - ".github/workflows/build-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply base sync fix
        shell: pwsh
        run: |
          git apply --check build/sync_fix.patch
          git apply build/sync_fix.patch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Apply latest JournalTOiR fixes
        shell: pwsh
        run: |
          python build/apply_sync_ui_v2.py

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Validate sources
        shell: pwsh
        run: |
          python -m compileall -q .
          python -c "import services.sync_service; import gui.main_window; print('imports ok')"

      - name: Build installed application folder
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name Journal_TOiR --icon resources/app_icon.ico --add-data "resources;resources" main.py
          if (!(Test-Path "dist\Journal_TOiR\Journal_TOiR.exe")) { throw "Application build failed" }

      - name: Optional Authenticode sign application
        shell: pwsh
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGN_PFX_BASE64)) {
            Write-Host "Code-signing certificate is not configured; application will remain unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /fd SHA256 /f $pfx /p $env:CODE_SIGN_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "dist\Journal_TOiR\Journal_TOiR.exe"
          & $signtool verify /pa /v "dist\Journal_TOiR\Journal_TOiR.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\JournalTOiR.iss"
          if (!(Test-Path "installer\output\JournalTOiR_Setup_1.0.0.exe")) { throw "Installer build failed" }

      - name: Optional Authenticode sign installer
        shell: pwsh
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGN_PFX_BASE64)) {
            Write-Host "Code-signing certificate is not configured; installer will remain unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          if (!(Test-Path $pfx)) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64))
          }
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /fd SHA256 /f $pfx /p $env:CODE_SIGN_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "installer\output\JournalTOiR_Setup_1.0.0.exe"
          & $signtool verify /pa /v "installer\output\JournalTOiR_Setup_1.0.0.exe"

      - name: Hash installer
        shell: pwsh
        run: |
          Get-Item "installer\output\JournalTOiR_Setup_1.0.0.exe" | Format-List Name,Length,LastWriteTime
          Get-FileHash "installer\output\JournalTOiR_Setup_1.0.0.exe" -Algorithm SHA256

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: JournalTOiR-Installer-1.0.0
          path: installer/output/JournalTOiR_Setup_1.0.0.exe
          if-no-files-found: error
          retention-days: 7
